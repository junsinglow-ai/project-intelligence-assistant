# Retrieval-quality query set for the embedding benchmark (eval/embedding_bench.py).
#
# Gold labels are CHUNK-level, keyed by (source, citation). That pair is unique
# across all 38 chunks in the corpus, and chunk identity comes from
# `make_id(source, *parts)` in app/ingestion/chunking.py -- UUIDv5 over structure,
# with no embedding input -- so one label file is valid for every embedding model.
#
# Chunk-level rather than file-level because file-level saturates: the corpus is
# 38 chunks across 6 files and TOP_K=8 retrieves 21% of it, so file-level recall@5
# is already 0.89 for every configuration and cannot separate two embedders.
#
# Tiers, so a result can be read by difficulty rather than as one blended number:
#   lexical    - the manifest's own wording. Regression check; BM25 does well here.
#   paraphrase - same information need, vocabulary deliberately shifted off the
#                documents' phrasing. Where a stronger embedder should pay off.
#   semantic   - indirect phrasing, near-zero lexical overlap. Most diagnostic.
#   negative   - nothing in the corpus answers this. Scored separately (see below),
#                never folded into recall/MRR.
#
# HONESTY RULE: these labels were authored against the chunk texts BEFORE any model
# was swept, and are not revised after seeing results. Changing a label to improve a
# score invalidates the comparison. If a label is wrong, fix it and re-run every arm.

version: 1
corpus: data/raw            # Conduit Unified LLM Gateway (CND-26), manifest seed 11
chunk_count: 38

queries:

  # ---------------------------------------------------------------- lexical --
  # The eight usable questions from data/manifest.json, verbatim. The manifest's
  # ninth ("what does the memo say about the budget") is M1 in the negative-ish
  # set below: it IS answerable, from the memo's own statement that it omits the
  # financials, so it is kept as a retrieval target rather than a negative.

  - id: L1
    tier: lexical
    question: "What is the approved budget for Conduit Unified LLM Gateway?"
    gold:
      - {source: Conduit_Unified_LLM_Gateway_Financial_Summary_FY26.xlsx, citation: "Summary!total row"}
      - {source: conduit_unified_llm_gateway_financials_export.csv, citation: "total row"}
      - {source: CND-26_PSR_2026-09-18.pdf, citation: "§4. Financial position (p. 1)"}
    why: "6,315,000 USD appears as the TOTAL budget in both tabular exports and in the Q3 financial table."

  - id: L2
    tier: lexical
    question: "How much had been spent by the end of 2026-Q3?"
    gold:
      - {source: Conduit_Unified_LLM_Gateway_Financial_Summary_FY26.xlsx, citation: "Summary!total row"}
      - {source: conduit_unified_llm_gateway_financials_export.csv, citation: "total row"}
      - {source: CND-26_PSR_2026-09-18.pdf, citation: "§4. Financial position (p. 1)"}
    why: "5,183,000 USD / 82 pct of approved budget."

  - id: L3
    tier: lexical
    question: "Is the project over or under budget as at 2026-Q3?"
    gold:
      - {source: CND-26_PSR_2026-09-18.pdf, citation: "§4. Financial position (p. 1)"}
      - {source: Conduit_Unified_LLM_Gateway_Financial_Summary_FY26.xlsx, citation: "Summary!total row"}
      - {source: conduit_unified_llm_gateway_financials_export.csv, citation: "total row"}
    why: "Variance 1,132,000 USD, annotated 'Under budget' in the Q3 report."

  - id: L4
    tier: lexical
    question: "Which cost category carries the largest approved budget?"
    gold:
      - {source: Conduit_Unified_LLM_Gateway_Financial_Summary_FY26.xlsx, citation: "Summary!rows 5-8"}
      - {source: conduit_unified_llm_gateway_financials_export.csv, citation: "rows 2-5"}
    why: "ENG-01 Platform engineering, budget 2,400,000 -- the largest line, in the first block of cost rows."

  - id: L5
    tier: lexical
    question: "How many risks are currently open?"
    gold:
