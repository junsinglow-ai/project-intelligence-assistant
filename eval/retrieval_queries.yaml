      - {source: conduit_unified_llm_gateway-status-memo-jun2026.pdf, citation: "document header"}
      - {source: CND-26_PSR_2026-09-18.pdf, citation: "document header"}
    why: "Overall status is recorded in each report's header block: green / amber / amber."

