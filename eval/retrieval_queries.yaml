    question: "Which risk has the highest financial exposure, and who owns it?"
    gold:
      - {source: conduit_unified_llm_gateway_risk_register_v4.csv, citation: "rows 4-5"}
    why: "R-003, exposure $520,000, owner Yusuf Karim."

  - id: L7
