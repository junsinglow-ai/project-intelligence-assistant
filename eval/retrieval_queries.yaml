      - {source: conduit_unified_llm_gateway_risk_register_v4.csv, citation: "rows 4-5"}
      - {source: conduit_unified_llm_gateway_risk_register_v4.csv, citation: "rows 6-7"}
      - {source: conduit_unified_llm_gateway_risk_register_v4.csv, citation: "rows 8-9"}
      - {source: conduit_unified_llm_gateway_risk_register_v4.csv, citation: "rows 10-11"}
      - {source: conduit_unified_llm_gateway_risk_register_v4.csv, citation: "rows 12-13"}
    why: "Counting requires the whole register; every row chunk is relevant evidence."

  - id: L6
