# Builds the backend image for Cloud Run (DECISIONS.md D-008).
#
# `gcloud run deploy --source` expects a Dockerfile at the root of the source
# directory, but this one lives in backend/ while its build context is the
# repository root -- the image bakes in ./data, which sits outside backend/.
# This config keeps the Dockerfile where it belongs and still builds with the
# right context.
steps:
  - name: gcr.io/cloud-builders/docker
    # The builder runs classic `docker build`, which does not understand the
    # `RUN --mount=type=cache` in backend/Dockerfile and fails the step with
    # "the --mount option requires BuildKit". Local builds get BuildKit by
    # default, so this only shows up here.
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "backend/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
  # The ONNX warm-up step downloads ~150MB; the default machine is fine but
  # the build is slower than a pure dependency install.
  machineType: E2_HIGHCPU_8
timeout: 1200s
